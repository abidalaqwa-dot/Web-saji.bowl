<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <!-- Kraft Paper Gradient -->
    <linearGradient id="kraft-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D7B286"/>
      <stop offset="45%" stop-color="#C29B6C"/>
      <stop offset="80%" stop-color="#AE8554"/>
      <stop offset="100%" stop-color="#936D3E"/>
    </linearGradient>
    
    <!-- Purple Sweet Potato Tortilla Gradient -->
    <radialGradient id="purple-tortilla" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#6F346E"/>
      <stop offset="65%" stop-color="#552454"/>
      <stop offset="95%" stop-color="#3D153D"/>
      <stop offset="100%" stop-color="#2E0E2E"/>
    </radialGradient>

    <!-- Grilled Chicken Gradient -->
    <linearGradient id="chicken-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5D8A4"/>
      <stop offset="50%" stop-color="#E2B870"/>
      <stop offset="85%" stop-color="#B87B2E"/>
      <stop offset="100%" stop-color="#7A4B13"/>
    </linearGradient>

    <!-- Fresh Greens Gradient -->
    <linearGradient id="green-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7CB342"/>
      <stop offset="60%" stop-color="#4CAF50"/>
      <stop offset="100%" stop-color="#2E7D32"/>
    </linearGradient>

    <!-- Soft Drop Shadow -->
    <filter id="wrap-shadow" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#142617" flood-opacity="0.35"/>
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#142617" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- Group for entire wrap with drop shadow -->
  <g filter="url(#wrap-shadow)">
    <!-- Kraft paper sleeve wrapping the lower half -->
    <path d="M 200 280 C 180 340 170 410 185 470 C 195 505 230 535 295 535 C 365 535 405 505 415 470 C 430 410 420 340 400 280 C 370 295 330 300 300 300 C 270 300 230 295 200 280 Z" fill="url(#kraft-grad)"/>

    <!-- Kraft Paper Folds & Crinkles -->
    <path d="M 185 360 C 220 380 260 365 290 385 C 330 410 380 375 415 390" stroke="#876132" stroke-width="3" fill="none" opacity="0.6"/>
    <path d="M 195 440 C 235 460 275 440 310 465 C 345 490 385 465 410 470" stroke="#7A5326" stroke-width="2.5" fill="none" opacity="0.5"/>
    <path d="M 250 310 L 230 510" stroke="#FFFFFF" stroke-width="1.5" opacity="0.15"/>
    <path d="M 350 310 L 370 510" stroke="#503310" stroke-width="2" opacity="0.3"/>

    <!-- Purple Sweet Potato Tortilla Wrap (Cross Section & Upper Edge) -->
    <!-- Outer Tortilla Rim -->
    <ellipse cx="300" cy="275" rx="115" ry="95" fill="url(#purple-tortilla)" stroke="#7A497A" stroke-width="4"/>
    
    <!-- Inner Tortilla Rim Crease -->
    <ellipse cx="300" cy="275" rx="104" ry="85" fill="#3D153D"/>

    <!-- Fresh Green Lettuce Leaves (Back and sides) -->
    <path d="M 215 260 C 205 230 220 205 245 215 C 270 225 280 250 270 270 Z" fill="url(#green-grad)"/>
    <path d="M 330 270 C 320 235 345 205 375 220 C 395 230 395 260 380 275 Z" fill="url(#green-grad)"/>
    <path d="M 270 230 C 285 200 315 200 330 225 C 315 240 290 245 270 230 Z" fill="#689F38"/>

    <!-- Leaf Veins -->
    <path d="M 235 225 Q 245 245 255 255" stroke="#DCEDC8" stroke-width="1.5" fill="none" opacity="0.7"/>
    <path d="M 360 225 Q 355 245 350 260" stroke="#DCEDC8" stroke-width="1.5" fill="none" opacity="0.7"/>

    <!-- Golden Juicy Grilled Chicken Breast Chunks (Center-right) -->
    <g>
      <rect x="270" y="245" width="45" height="32" rx="10" fill="url(#chicken-grad)" transform="rotate(-12 292 261)"/>
      <line x1="275" y1="252" x2="310" y2="252" stroke="#4E2B08" stroke-width="2" transform="rotate(-12 292 261)"/>
      <line x1="275" y1="262" x2="310" y2="262" stroke="#4E2B08" stroke-width="2" transform="rotate(-12 292 261)"/>

      <rect x="240" y="260" width="38" height="28" rx="8" fill="url(#chicken-grad)" transform="rotate(18 259 274)"/>
      <line x1="244" y1="267" x2="274" y2="267" stroke="#4E2B08" stroke-width="2" transform="rotate(18 259 274)"/>

      <rect x="300" y="270" width="42" height="26" rx="8" fill="url(#chicken-grad)" transform="rotate(5 321 283)"/>
      <line x1="304" y1="278" x2="338" y2="278" stroke="#4E2B08" stroke-width="2" transform="rotate(5 321 283)"/>
    </g>

    <!-- Sweet Yellow Corn Kernels -->
    <circle cx="255" cy="245" r="7" fill="#FDD835"/>
    <circle cx="265" cy="240" r="6" fill="#FBC02D"/>
    <circle cx="245" cy="252" r="5.5" fill="#FFEB3B"/>
    <circle cx="340" cy="265" r="7" fill="#FDD835"/>
    <circle cx="352" cy="260" r="6" fill="#FBC02D"/>
    <circle cx="335" cy="275" r="6" fill="#FFEB3B"/>

    <!-- Diced Carrots & Red Cabbage Flakes -->
    <rect x="280" y="285" width="10" height="7" rx="2" fill="#E65100"/>
    <rect x="295" y="290" width="8" height="6" rx="2" fill="#F57C00"/>
    <path d="M 230 270 Q 240 280 235 290" stroke="#AB47BC" stroke-width="3" fill="none"/>
    <path d="M 355 280 Q 365 290 360 300" stroke="#8E24AA" stroke-width="3" fill="none"/>

    <!-- Drizzle of Savory Sauce -->
    <path d="M 260 265 Q 285 275 315 260 Q 335 270 345 285" stroke="#C85A32" stroke-width="3.5" fill="none" opacity="0.85" stroke-linecap="round"/>

    <!-- Brown Paper Ribbon & SAJI Branding on Sleeve -->
    <path d="M 205 385 C 245 405 355 405 395 385 L 398 425 C 358 445 248 445 202 425 Z" fill="#F7F5F0" opacity="0.95"/>
    <text x="300" y="412" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="16" fill="#1E3622" text-anchor="middle" letter-spacing="2">SAJI WRAP • YOGYA</text>
  </g>
</svg>
