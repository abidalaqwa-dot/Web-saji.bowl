<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 — Halaman Tidak Ditemukan | SAJI</title>
  <link rel="icon" type="image/svg+xml" href="assets/logo.svg">
  <meta name="robots" content="noindex, follow">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #F7F5F0;
      color: #1E3622;
      font-family: -apple-system, BlinkMacSystemFont, 'Plus Jakarta Sans', system-ui, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
    }
    .card-404 {
      background: #FFFFFF;
      border: 2px solid #1E3622;
      box-shadow: 6px 8px 0px #1E3622;
      border-radius: 24px;
      padding: 48px 32px;
      max-width: 480px;
      width: 100%;
    }
    .badge-404 {
      display: inline-block;
      background: #C85A32;
      color: #F7F5F0;
      padding: 6px 14px;
      border-radius: 999px;
      font-weight: 800;
      font-size: 0.78rem;
      letter-spacing: 0.08em;
      margin-bottom: 16px;
      border: 1.5px solid #1E3622;
    }
    h1 {
      font-size: clamp(2rem, 6vw, 2.75rem);
      font-weight: 900;
      line-height: 1.1;
      margin-bottom: 12px;
      color: #1E3622;
      letter-spacing: 0.02em;
    }
    p {
      color: #3b503e;
      font-size: 0.95rem;
      line-height: 1.55;
      margin-bottom: 28px;
    }
    .btn-return {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: #C87D32;
      color: #1E3622;
      font-weight: 800;
      font-size: 0.92rem;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      padding: 14px 28px;
      border-radius: 999px;
      border: 2px solid #1E3622;
      box-shadow: 3px 4px 0px #1E3622;
      text-decoration: none;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }
    .btn-return:hover {
      transform: translate(-2px, -2px);
      box-shadow: 5px 6px 0px #1E3622;
      background-color: #d88a3e;
    }
  </style>
</head>
<body>
  <div class="card-404">
    <div style="margin-bottom: 20px;">
      <img src="assets/logo.svg" alt="SAJI Sajian Healthy Bowl Logo" width="110" height="46" style="height: 46px; width: auto;">
    </div>
    <span class="badge-404">ERROR 404</span>
    <h1>HALAMAN TIDAK DITEMUKAN</h1>
    <p>Maaf, halaman yang Anda tuju tidak tersedia atau tautan telah berpindah. Yuk kembali menikmati sajian sehat bernutrisi dengan jiwa Nusantara!</p>
    <a href="/" class="btn-return">KEMBALI KE BERANDA SAJI 🥗</a>
  </div>
</body>
</html>
